name: Market Structure Scanner (4h)

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests numpy

      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data/market.db
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      - name: Run scanner
        run: python scanner.py

      - name: Sync root files for Pages
        run: cp docs/data.json docs/backtest.json docs/history.json . 2>/dev/null; echo "synced"

      - name: Send notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python src/notify.py
        continue-on-error: true

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/ docs/ data.json history.json backtest.json index.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "scan: $(date -u +%Y-%m-%d_%H:%M)"
          git push





