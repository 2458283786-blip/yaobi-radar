name: Market Structure Scanner (4h)

on:
  schedule:
    # UTC时间: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00
    # = 北京时间: 08:00, 12:00, 16:00, 20:00, 00:00, 04:00
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:  # 手动触发

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests numpy

      - name: Restore DB from cache
        uses: actions/cache@v4
        with:
          path: data/market.db
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      - name: Run scanner
        run: python scanner.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_id }}
          path: |
            data/market.db
            

      - name: Commit & push DB update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/  2>/dev/null || true
          git diff --staged --quiet || git commit -m "scan: $(date -u +%Y-%m-%d_%H:%M)"
          git push
        continue-on-error: true

