<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YaoBi Radar</title>
<style>
:root {
  --bg:#0a0a0f; --card:#13131a; --border:#1e1e2e; --text:#cdd6f4;
  --muted:#6c7086; --accent:#89b4fa; --red:#f38ba8; --green:#a6e3a1;
  --yellow:#f9e2af; --purple:#cba6f7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px;min-height:100vh}
.container{max-width:860px;margin:0 auto}
.header{text-align:center;padding:30px 0 20px}
.header h1{font-size:28px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{color:var(--muted);margin-top:6px;font-size:14px}
.tabs{display:flex;gap:4px;margin-bottom:24px;justify-content:center}
.tab{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:rgba(137,180,250,.1);border-color:var(--accent);color:var(--accent)}
.meta{display:flex;gap:12px;justify-content:center;margin:12px 0 24px;flex-wrap:wrap}
.meta span{background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:12px;transition:border-color .2s}
.card:hover{border-color:rgba(137,180,250,.3)}
.badge-futures{display:inline-block;background:rgba(137,180,250,.15);color:var(--accent);font-size:10px;padding:2px 8px;border-radius:10px;margin-left:8px;font-weight:600;text-transform:uppercase}
.stealth-tag{display:inline-block;background:rgba(201,166,247,.15);color:var(--purple);font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px;font-weight:600}
.trending-tag{display:inline-block;background:rgba(249,226,175,.15);color:var(--yellow);font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px;font-weight:600}
.social-row{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.social-row span{padding:3px 8px;background:var(--bg);border-radius:6px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.rank{font-size:22px;font-weight:700;color:var(--purple);min-width:36px}
.symbol{font-size:18px;font-weight:600;margin-left:8px}
.score{font-size:13px;padding:4px 10px;border-radius:20px;font-weight:600}
.score-hi{background:rgba(166,227,161,.15);color:var(--green)}
.score-mid{background:rgba(249,226,175,.15);color:var(--yellow)}
.anomaly{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:center}
.anomaly:last-child{border:none}
.a-type{font-weight:600;min-width:110px;color:var(--accent);font-size:12px}
.a-score{color:var(--green);font-size:11px;margin-left:auto}
.warning{color:var(--red);font-size:13px;margin-top:8px;padding:8px 12px;background:rgba(243,139,168,.1);border-radius:8px}
.ai-box{margin-top:24px;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.ai-box h3{color:var(--purple);margin-bottom:12px}
.ai-box pre{font-size:13px;line-height:1.6;white-space:pre-wrap;color:var(--text)}
.history-item{padding:14px 20px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.history-item:hover{border-color:var(--accent)}
.history-date{font-weight:600}
.history-link{color:var(--accent);font-size:13px;text-decoration:none}
.history-link:hover{text-decoration:underline}
.backtest-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
.backtest-table th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:500}
.backtest-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.backtest-table .up{color:var(--green)}
.backtest-table .down{color:var(--red)}
.footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}
.footer a{color:var(--muted)}
.loading{text-align:center;padding:60px;color:var(--muted)}
.error{text-align:center;padding:60px;color:var(--red)}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>YaoBi Radar <span style="font-size:16px;color:var(--accent)">合约版</span></h1>
    <div class="sub">Binance Futures · USDT Perpetual Contracts</div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('scan')">最新扫描</div>
    <div class="tab" onclick="switchTab('history')">历史记录</div>
    <div class="tab" onclick="switchTab('backtest')">复盘统计</div>
  </div>
  <div class="meta" id="meta"></div>
  <div id="content"><div class="loading">加载中...</div></div>
  <div class="footer">
    每4小时自动扫描 · <a href="https://github.com/2458283786-blip/yaobi-radar">GitHub</a>
  </div>
</div>

<script>
let currentTab = 'scan';
let scanData = null;

async function init() {
  try {
    const r = await fetch('data.json?v=' + Date.now());
    scanData = await r.json();
  } catch(e) {}
  switchTab('scan');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab:nth-child(' + ({scan:1,history:2,backtest:3}[tab]) + ')').classList.add('active');
  if (tab === 'scan') renderScan();
  else if (tab === 'history') renderHistory();
  else if (tab === 'backtest') renderBacktest();
}

function renderScan() {
  if (!scanData || !scanData.candidates || !scanData.candidates.length) {
    document.getElementById('meta').innerHTML = '';
    document.getElementById('content').innerHTML = '<div class="empty">暂无数据，等待首次扫描...</div>';
    return;
  }

  var d = scanData;
  document.getElementById('meta').innerHTML =
    '<span>更新: ' + (d.updated||'').slice(0,16) + '</span>' +
    '<span style="color:var(--yellow)">大盘: ' + (d.regime||'?') + '</span>' +
    '<span>扫描: ' + (d.total_scanned||0) + ' 个合约</span>' +
    '<span style="color:var(--green)">发现: ' + d.candidates.length + ' 个异常</span>';

  // Deduplicate
  var seen = {};
  d.candidates.forEach(function(c) {
    if (!seen[c.symbol] || seen[c.symbol].score < c.score) {
      seen[c.symbol] = c;
    }
  });
  var unique = Object.values(seen).sort(function(a,b) { return b.score - a.score; });

  var html = '';
  unique.forEach(function(c, i) {
    var cls = c.score >= 50 ? 'score-hi' : 'score-mid';
    html += '<div class="card">' +
      '<div class="card-header">' +
        '<div><span class="rank">#' + (i+1) + '</span>' +
        '<span class="symbol">' + c.symbol + '</span>' +
        '<span class="badge-futures">合约</span>';
    if (c.stealth_phase) html += '<span class="stealth-tag">埋伏期</span>';
    if (c.trending_score > 0) html += '<span class="trending-tag">Trending</span>';
    html += '</div>' +
        '<span class="score ' + cls + '">' + c.score.toFixed(1) + '</span>' +
      '</div>';
    if (c.anomalies) {
      c.anomalies.forEach(function(a) {
        html += '<div class="anomaly">' +
          '<span class="a-type">' + a.type + '</span><span>' + a.detail + '</span>' +
          '<span class="a-score">' + a.score + '</span></div>';
      });
    }
    if (c.social_heat) {
      html += '<div class="social-row">' +
        '<span>热度: ' + c.social_heat + '</span>';
      if (c.twitter_followers > 0) html += '<span>Twitter: ' + (c.twitter_followers/1000).toFixed(0) + 'K</span>';
      if (c.stealth_phase) html += '<span style="color:var(--purple)">尚未被发现</span>';
      html += '</div>';
    }
    if (c.warnings && c.warnings.length) {
      html += '<div class="warning">WARNING: ' + c.warnings.join(', ') + '</div>';
    }
    html += '</div>';
  });

  document.getElementById('content').innerHTML = html;

  fetch('ai_analysis.md?v=' + Date.now()).then(function(r) { return r.ok ? r.text() : null; }).then(function(text) {
    if (text) {
      document.getElementById('content').insertAdjacentHTML('beforeend',
        '<div class="ai-box"><h3>AI 分析</h3><pre>' + text + '</pre></div>');
    }
  }).catch(function(){});
}

function renderHistory() {
  document.getElementById('meta').innerHTML = '';
  fetch('history.json?v=' + Date.now()).then(function(r) { return r.json(); }).then(function(d) {
    var reports = d.reports || [];
    if (!reports.length) {
      document.getElementById('content').innerHTML = '<div class="empty">暂无历史报告，等待扫描积累...</div>';
      return;
    }
    var html = '';
    reports.forEach(function(date) {
      html += '<div class="history-item">' +
        '<span class="history-date">' + date + '</span>' +
        '<a class="history-link" href="docs/report-' + date + '.md" target="_blank">查看报告</a>' +
      '</div>';
    });
    document.getElementById('content').innerHTML = html;
  }).catch(function(e) {
    document.getElementById('content').innerHTML = '<div class="error">加载失败，请刷新重试</div>';
  });
}

function renderBacktest() {
  document.getElementById('meta').innerHTML = '';
  fetch('backtest.json?v=' + Date.now()).then(function(r) { return r.json(); }).then(function(d) {
    if (!d.entries || !d.entries.length) {
      document.getElementById('content').innerHTML = '<div class="empty">复盘数据积累中... 需要7天以上扫描历史</div>';
      return;
    }
    var html = '<p style="margin-bottom:16px;color:var(--muted)">历史候选币的7日回报追踪</p>' +
      '<table class="backtest-table">' +
      '<tr><th>日期</th><th>币种</th><th>入场价</th><th>7日回报</th></tr>';
    d.entries.forEach(function(e) {
      var cls = e.ret7d >= 0 ? 'up' : 'down';
      html += '<tr>' +
        '<td>' + e.date + '</td><td>' + e.symbol + '</td><td>' + (e.price ? e.price.toFixed(6) : 'N/A') + '</td>' +
        '<td class="' + cls + '">' + (e.ret7d != null ? (e.ret7d>0?'+':'')+e.ret7d.toFixed(1)+'%' : 'pending') + '</td>' +
      '</tr>';
    });
    html += '</table>';
    document.getElementById('content').innerHTML = html;
  }).catch(function(e) {
    document.getElementById('content').innerHTML = '<div class="empty">复盘数据暂不可用，需要7天以上扫描历史</div>';
  });
}

init();
</script>
</body>
</html>
