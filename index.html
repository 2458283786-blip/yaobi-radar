<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妖币雷达 · 合约版</title>
<style>
:root{--bg:#0a0a0f;--card:#13131a;--border:#1e1e2e;--text:#cdd6f4;--muted:#6c7086;--accent:#89b4fa;--red:#f38ba8;--green:#a6e3a1;--yellow:#f9e2af;--purple:#cba6f7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;padding:20px;min-height:100vh}
.c{max-width:860px;margin:0 auto}
.hdr{text-align:center;padding:30px 0 20px}
.hdr h1{font-size:28px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .sub{color:var(--muted);margin-top:6px;font-size:14px}
.tabs{display:flex;gap:4px;margin-bottom:24px;justify-content:center}
.tab{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.on{background:rgba(137,180,250,.1);border-color:var(--accent);color:var(--accent)}
.meta{display:flex;gap:12px;justify-content:center;margin:12px 0 24px;flex-wrap:wrap}
.meta span{background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:12px}
.cd-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.rk{font-size:22px;font-weight:700;color:var(--purple);min-width:36px}
.sym{font-size:18px;font-weight:600;margin-left:8px}
.badge{display:inline-block;background:rgba(137,180,250,.15);color:var(--accent);font-size:10px;padding:2px 8px;border-radius:10px;margin-left:8px;font-weight:600}
.sc{font-size:13px;padding:4px 10px;border-radius:20px;font-weight:600}
.sc-hi{background:rgba(166,227,161,.15);color:var(--green)}
.sc-mid{background:rgba(249,226,175,.15);color:var(--yellow)}
.ano{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:center}
.ano:last-child{border:none}
.at{font-weight:600;min-width:90px;color:var(--accent);font-size:12px}
.av{color:var(--green);font-size:11px;margin-left:auto}
.warn{color:var(--red);font-size:13px;margin-top:8px;padding:8px 12px;background:rgba(243,139,168,.1);border-radius:8px}
.crow{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;font-size:12px}
.crow span{color:var(--muted)}
.oi-v{color:var(--accent)}
.fn{color:var(--green);font-weight:600}
.fp{color:var(--red);font-weight:600}
.aibox{margin-top:24px;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.aibox h3{color:var(--purple);margin-bottom:12px}
.aibox pre{font-size:13px;line-height:1.6;white-space:pre-wrap}
.hitem{padding:14px 20px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hitem:hover{border-color:var(--accent)}
.hd{font-weight:600}
.hl{color:var(--accent);font-size:13px;text-decoration:none}
.hl:hover{text-decoration:underline}
.bt-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
.bt-table th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:500}
.bt-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.up{color:var(--green)}.down{color:var(--red)}
.ft{text-align:center;padding:30px;color:var(--muted);font-size:12px}
.ft a{color:var(--muted)}
.ld{text-align:center;padding:60px;color:var(--muted)}
.err{text-align:center;padding:60px;color:var(--red)}
.emp{text-align:center;padding:40px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="c">
  <div class="hdr">
    <h1>妖币雷达 · 合约版</h1>
    <div class="sub">币安 U本位永续合约 · 市场结构异常扫描 · 不预测价格</div>
  </div>
  <div class="tabs">
    <div class="tab on" id="tab0">最新扫描</div>
    <div class="tab" id="tab1">历史记录</div>
    <div class="tab" id="tab2">复盘统计</div>
  </div>
  <div class="meta" id="meta"></div>
  <div id="main"><div class="ld">加载中...</div></div>
  <div class="ft">
    每4小时自动扫描 · <a href="https://github.com/2458283786-blip/yaobi-radar">GitHub</a> · 不构成投资建议
  </div>
</div>

<script>
var data = null;
var tab = 0;

var AL = {volatility_compression:'波动压缩',relative_strength:'相对强度',oi_acceleration:'OI加速',volume_expansion:'量能扩张',funding_divergence:'费率背离',oi_mc_divergence:'持仓比率'};

async function init(){
  try{
    var r=await fetch('data.json?v=2');
    data=await r.json();
  }catch(e){}
  showTab(0);
}

function showTab(n){
  tab=n;
  for(var i=0;i<3;i++) document.getElementById('tab'+i).className=(i===n?'tab on':'tab');
  if(n===0) renderScan();
  else if(n===1) renderHistory();
  else renderBacktest();
}
document.getElementById('tab0').onclick=function(){showTab(0)};
document.getElementById('tab1').onclick=function(){showTab(1)};
document.getElementById('tab2').onclick=function(){showTab(2)};

function renderScan(){
  if(!data||!data.candidates||!data.candidates.length){
    document.getElementById('meta').innerHTML='';
    document.getElementById('main').innerHTML='<div class="err">暂无数据，等待首次扫描...</div>';
    return;
  }
  var d=data;
  var rgn=d.regime==='Bull'?'牛市':d.regime==='Bear'?'熊市':'震荡';
  document.getElementById('meta').innerHTML='<span>更新: '+(d.updated||'').slice(0,16)+'</span><span style="color:var(--yellow)">市场: '+rgn+'</span><span>扫描: '+d.total_scanned+' 个合约</span><span style="color:var(--green)">异常: '+d.candidates.length+' 个</span>';

  var seen={}, uniq=[];
  d.candidates.forEach(function(c){
    if(!seen[c.symbol]||seen[c.symbol].score<c.score) seen[c.symbol]=c;
  });
  for(var k in seen) uniq.push(seen[k]);
  uniq.sort(function(a,b){return b.score-a.score});

  var h='';
  uniq.forEach(function(c,i){
    var cls=c.score>=50?'sc-hi':'sc-mid';
    h+='<div class="card"><div class="cd-hd"><div><span class="rk">#'+(i+1)+'</span><span class="sym">'+c.symbol+'</span><span class="badge">合约</span></div><span class="sc '+cls+'">'+c.score.toFixed(1)+' 分</span></div>';
    var om=(c.oi/1e6).toFixed(1), fpct=(c.funding*100).toFixed(4), fcls=c.funding<0?'fn':'fp', vm=((c.volume_24h||0)/1e6).toFixed(1);
    h+='<div class="crow"><span>持仓: <span class="oi-v">'+om+'M</span></span><span>费率: <span class="'+fcls+'">'+(c.funding>=0?'+':'')+fpct+'%</span></span><span>成交: '+vm+'M USDT</span></div>';
    if(c.anomalies) c.anomalies.forEach(function(a){
      h+='<div class="ano"><span class="at">'+(AL[a.type]||a.type)+'</span><span>'+a.detail+'</span><span class="av">'+a.score+'分</span></div>';
    });
    var cr=c.crash_risk||0;if(cr>=30)h+='<div class="warn" style="background:rgba(243,139,168,.15)">????: '+cr+'? | '+((c.crash_warnings||[]).join(', '))+'</div>';else if(cr>=15)h+='<div class="warn" style="background:rgba(249,226,175,.1);color:var(--yellow)">????: '+cr+'? | '+((c.crash_warnings||[]).join(', '))+'</div>';
    if(c.warnings&&c.warnings.length) h+='<div class="warn">风险: '+c.warnings.join(', ')+'</div>';
    var sh=c.social_heat||'?';var sc=sh.indexOf('??')>=0||sh.indexOf('?')>=0?'fn':'fp';h+='<div class="crow"><span>??: <span class="'+sc+'">'+sh+'</span></span></div>';h+='</div>';
  });
  document.getElementById('main').innerHTML=h;

  fetch('ai_analysis.md?v=2').then(function(r){return r.ok?r.text():null}).then(function(t){
    if(t) document.getElementById('main').insertAdjacentHTML('beforeend','<div class="aibox"><h3>AI 解读</h3><pre>'+t+'</pre></div>');
  }).catch(function(){});
}

function renderHistory(){
  document.getElementById('meta').innerHTML='';
  fetch('history.json?v=2')
    .then(function(r){if(!r.ok) throw new Error('fail'); return r.json()})
    .then(function(d){
      var reports=d.reports||[];
      if(!reports.length){ document.getElementById('main').innerHTML='<div class="emp">暂无历史报告</div>'; return; }
      var h='';
      reports.forEach(function(dt){
        h+='<div class="hitem"><span class="hd">'+dt+'</span><a class="hl" href="docs/report-'+dt+'.md" target="_blank">查看报告</a></div>';
      });
      document.getElementById('main').innerHTML=h;
    })
    .catch(function(){
      document.getElementById('main').innerHTML='<div class="err">加载失败，<a href="https://github.com/2458283786-blip/yaobi-radar/tree/master/docs" style="color:var(--accent)">在GitHub查看</a></div>';
    });
}

function renderBacktest(){
  document.getElementById('meta').innerHTML='';
  fetch('backtest.json?v=2')
    .then(function(r){if(!r.ok) throw new Error('fail'); return r.json()})
    .then(function(d){
      if(!d.entries||!d.entries.length){ document.getElementById('main').innerHTML='<div class="emp">复盘数据积累中，需要至少7天扫描历史</div>'; return; }
      var h='<p style="margin-bottom:16px;color:var(--muted)">历史候选 7日收益追踪</p><table class="bt-table"><tr><th>日期</th><th>币种</th><th>入选价</th><th>7日收益</th></tr>';
      d.entries.forEach(function(e){
        var cls=e.ret7d>=0?'up':'down';
        h+='<tr><td>'+e.date+'</td><td>'+e.symbol+'</td><td>'+(e.price?e.price.toFixed(6):'--')+'</td><td class="'+cls+'">'+(e.ret7d!=null?(e.ret7d>0?'+':'')+e.ret7d.toFixed(1)+'%':'待统计')+'</td></tr>';
      });
      h+='</table>';
      document.getElementById('main').innerHTML=h;
    })
    .catch(function(){
      document.getElementById('main').innerHTML='<div class="emp">暂无复盘数据</div>';
    });
}

init();
</script>
</body>
</html>
